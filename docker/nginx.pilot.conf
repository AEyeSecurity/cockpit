map $http_upgrade $cockpit_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' wss://$host https://maps.googleapis.com; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|operation)/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $identity_upstream http://auth:8080;
        proxy_pass $identity_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cockpit_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 180s;
        proxy_buffering off;
        access_log off;
    }
}
